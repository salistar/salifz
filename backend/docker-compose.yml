# ============================================
# Salifz - Docker Compose
# ============================================

version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:6
    container_name: salifz-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: salifz
    networks:
      - salifz-network

  # Redis
  redis:
    image: redis:alpine
    container_name: salifz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - salifz-network

  # Backend API
  backend:
    build: ./backend
    container_name: salifz-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      PORT: 8088
      MONGODB_URI: mongodb://mongodb:27017/salifz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-salifz_docker_secret_2024}
    networks:
      - salifz-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  salifz-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
