# ============================================================
# Salifz — surcouche de production
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Reprend la pile de développement et corrige ce qui ne doit pas partir en
# production : code figé dans l'image, build statique du web, ports internes
# fermés, stockage objet réel.
# ============================================================

services:
  api:
    environment:
      NODE_ENV: production
    volumes:
      # Le montage `./backendv2:/app` du développement est retiré : une image
      # de production doit contenir exactement ce qui a été testé, et non le
      # contenu d'un dossier de l'hôte.
      - api-uploads:/app/uploads
    restart: always

  web:
    build:
      target: prod
      args:
        # Servi par nginx sur la même origine que l'API : plus de préflight
        # CORS, et les URL restent valides derrière n'importe quel domaine.
        VITE_API_URL: /api/v1
        VITE_WS_URL: /
    ports:
      - "80:80"
    restart: always

  # Les bases ne sont plus exposées sur l'hôte : elles ne doivent être
  # joignables que depuis le réseau interne de la composition.
  mongo:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  minio:
    # La console d'administration reste fermée ; seul le point d'entrée S3
    # est exposé si un service externe en a besoin.
    ports: []
    restart: always

  coturn:
    restart: always

  # Suivi de récitation. Aucun port publié — l'API Node le joint par le réseau
  # interne, et le service n'a rien à exposer au dehors.
  recitation:
    restart: always
    deploy:
      resources:
        limits:
          # Le modèle quantifié occupe environ 500 Mo une fois chargé ; la
          # marge couvre le décodage d'un extrait. La borne n'est pas une
          # précaution de principe : la machine héberge aussi Salorie et
          # Sudoku, et un service d'inférence sans plafond les emporte avec
          # lui le jour où deux récitations arrivent ensemble.
          memory: 2g
