# ============================================================
# coturn — STUN et TURN locaux pour Salifz
#
# STUN suffit à la plupart des appels : chaque pair découvre son adresse
# publique et la connexion s'établit en direct.
#
# TURN sert quand le direct est impossible — NAT symétrique, réseau
# d'entreprise, certains opérateurs mobiles. Le serveur relaie alors le flux.
# C'est ce qui fait la différence entre « l'appel marche chez moi » et
# « l'appel marche pour tout le monde ».
# ============================================================

listening-port=3478
# TLS désactivé en développement local ; en production, activer tls-listening-port
# avec un certificat, sinon les navigateurs refuseront le TURN depuis une page HTTPS.

# En local, coturn tourne en `network_mode: host` : il voit les interfaces
# directement et n'a pas besoin qu'on lui déclare une IP relais.
fingerprint

# Authentification par identifiants longue durée. Pour la production, préférer
# `use-auth-secret` avec des identifiants éphémères : un mot de passe fixe
# distribué à tous les clients finit toujours par fuiter.
lt-cred-mech
user=salifz:salifz_turn_dev
realm=salifz.local

# Plage de ports pour les flux relayés.
min-port=49160
max-port=49200

# Un serveur TURN ouvert est un relais gratuit pour n'importe qui : on interdit
# explicitement les adresses privées et de bouclage comme destination de relais.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Quotas : borne la bande passante qu'un seul utilisateur peut consommer.
user-quota=12
total-quota=1200

no-cli
simple-log
log-file=stdout
verbose
