# ============================================================
# coturn — STUN et TURN pour Salifz
#
# STUN suffit à la plupart des appels : chaque pair découvre son adresse
# publique et la connexion s'établit en direct.
#
# TURN sert quand le direct est impossible — NAT symétrique, réseau
# d'entreprise, certains opérateurs mobiles. Le serveur relaie alors le flux.
# C'est ce qui fait la différence entre « l'appel marche chez moi » et
# « l'appel marche pour tout le monde ».
# ============================================================

listening-port=3478
tls-listening-port=5349

# ------------------------------------------------------------
# Authentification par secret partagé (identifiants éphémères)
#
# Le mot de passe fixe précédent était distribué à tous les clients : un
# identifiant compilé dans une application est un identifiant public, et un
# relais TURN ouvert sert de proxy gratuit à n'importe qui.
#
# Avec `use-auth-secret`, l'API dérive un couple identifiant/mot de passe
# valable quelques heures (voir routes/rtc.js). Un identifiant qui fuite cesse
# de fonctionner de lui-même.
#
# `static-auth-secret` doit valoir exactement TURN_STATIC_SECRET côté API.
# ------------------------------------------------------------
use-auth-secret
# `static-auth-secret` n'est volontairement PAS écrit ici : ce fichier est
# versionné. Le secret est passé au démarrage par docker-compose, depuis .env
# (`--static-auth-secret=...`). Un secret dans un fichier suivi par git est un
# secret public — et un relais TURN dont le secret fuite devient un proxy
# gratuit pour n'importe qui.
realm=salifz.local

fingerprint

# ------------------------------------------------------------
# TLS
#
# Un navigateur sur une page HTTPS refuse un TURN en clair : sans certificat,
# les appels ne fonctionnent qu'en HTTP local. Les chemins ci-dessous sont
# montés par docker-compose ; en développement il s'agit d'un certificat
# auto-signé, en production d'un certificat réel (Let's Encrypt).
#
# coturn démarre même si ces fichiers sont absents : il journalise un
# avertissement et n'ouvre que les écouteurs en clair.
# ------------------------------------------------------------
cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key
# TLS 1.0 et 1.1 sont obsolètes et refusés par les navigateurs récents.
no-tlsv1
no-tlsv1_1

# Plage de ports pour les flux relayés.
min-port=49160
max-port=49200

# Un serveur TURN ouvert relaie n'importe quoi vers n'importe où : on interdit
# explicitement les adresses privées et de bouclage comme destination, sinon le
# relais devient un moyen d'atteindre le réseau interne.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Quotas : borne la bande passante qu'un seul utilisateur peut consommer.
user-quota=12
total-quota=1200

no-cli
simple-log
log-file=stdout
