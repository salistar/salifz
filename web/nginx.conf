server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'application est une SPA : toute route inconnue doit renvoyer index.html,
    # sinon un rechargement sur /halaqat donnerait un 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Les fichiers produits par Vite portent un hachage dans leur nom : ils sont
    # immuables et peuvent être mis en cache sans limite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API et WebSocket derrière la même origine : plus de préflight CORS, et le
    # cookie de session éventuel reste valide.
    location /api/ {
        proxy_pass http://api:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:8088;
        proxy_http_version 1.1;
        # Sans ces deux en-têtes, la connexion reste en interrogation longue
        # au lieu de basculer en WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://api:8088;
        proxy_set_header Host $host;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
