# ============================================================
# Salifz — pile de développement complète
#
#   docker compose up -d
#
# Fournit tout ce dont l'API a besoin, en local et sans compte
# chez un fournisseur :
#   - MongoDB   : persistance réelle (remplace la base en mémoire)
#   - Redis     : cache, sessions OTP et adaptateur Socket.IO multi-instance
#   - coturn    : serveurs STUN et TURN pour les appels audio/vidéo
#   - api       : le backend, qui sert aussi le WebSocket
#   - web       : l'application web
#
# L'application mobile et l'application web parlent au **même** backend :
# un seul modèle de données, un seul jeu de règles d'autorisation.
# ============================================================

services:
  mongo:
    image: mongo:7
    container_name: salifz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-salifz}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-salifz_dev_password}
      MONGO_INITDB_DATABASE: salifz
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: salifz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # `appendonly` conserve les données entre redémarrages : sans cela, un
    # simple restart viderait les sessions et les codes OTP en cours.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # STUN découvre l'adresse publique des pairs ; TURN relaie le flux quand la
  # connexion directe est impossible (NAT symétrique, réseau d'entreprise).
  # Sans TURN, une partie des appels échoue en silence.
  # Une clé privée doit rester lisible du seul service qui l'utilise. coturn
  # tourne en `nobody` : on recopie donc les certificats dans un volume avec
  # le propriétaire et les droits attendus, plutôt que d'ouvrir la clé en
  # lecture à tous ou de faire tourner coturn en root.
  coturn-certs:
    image: alpine:3
    container_name: salifz-coturn-certs
    volumes:
      - ./infra/coturn/certs:/src:ro
      - coturn-certs:/dst
    command: >
      /bin/sh -c "
      cp /src/turn.crt /src/turn.key /dst/ 2>/dev/null || echo 'aucun certificat : coturn demarrera sans TLS';
      chown -R 65534:65533 /dst 2>/dev/null || true;
      chmod 644 /dst/turn.crt 2>/dev/null || true;
      chmod 640 /dst/turn.key 2>/dev/null || true;
      echo 'certificats prets'
      "
    restart: "no"

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: salifz-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn-certs:/etc/coturn/certs:ro
    depends_on:
      coturn-certs:
        condition: service_completed_successfully
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      # Fourni au démarrage plutôt qu'écrit dans le fichier versionné.
      - "--static-auth-secret=${TURN_STATIC_SECRET:?TURN_STATIC_SECRET est obligatoire}"

  minio:
    image: minio/minio:latest
    container_name: salifz-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-salifz}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-salifz_minio_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crée le bucket au premier démarrage : sans lui, le premier envoi échouerait
  # sur un bucket inexistant.
  minio-init:
    image: minio/mc:latest
    container_name: salifz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-salifz} ${S3_SECRET_KEY:-salifz_minio_dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-salifz-recitations} &&
      echo 'bucket pret'
      "
    restart: "no"

  api:
    build:
      context: ./backendv2
      dockerfile: Dockerfile
    container_name: salifz-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      NODE_ENV: development
      PORT: 8088
      MONGODB_URI: mongodb://${MONGO_USER:-salifz}:${MONGO_PASSWORD:-salifz_dev_password}@mongo:27017/salifz?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET est obligatoire}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:?JWT_RESET_SECRET est obligatoire}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
      TURN_URL: ${TURN_URL:-turn:localhost:3478}
      STUN_URL: ${STUN_URL:-stun:localhost:3478}
      # Doit valoir exactement `static-auth-secret` de turnserver.conf.
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:?TURN_STATIC_SECRET est obligatoire}
      RTC_PUBLIC_HOST: ${RTC_PUBLIC_HOST:-}
      # Stockage objet : dès que S3_BUCKET est là, les récitations n'écrivent
      # plus sur le disque éphémère du conteneur.
      S3_BUCKET: ${S3_BUCKET:-salifz-recitations}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-salifz}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-salifz_minio_dev}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      # Le code est monté depuis l'hôte : une modification est prise en compte
      # au redémarrage du conteneur, sans reconstruire l'image. À retirer pour
      # une image de production, qui doit être figée.
      - ./backendv2:/app
      # `node_modules` reste celui de l'image : les binaires natifs compilés
      # pour Alpine ne sont pas ceux de l'hôte Windows.
      - /app/node_modules
      # Les enregistrements de récitation survivent à la recréation du conteneur.
      - api-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: salifz-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8088/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8088}
    depends_on:
      - api

volumes:
  coturn-certs:
  mongo-data:
  redis-data:
  minio-data:
  api-uploads:
